<div class="brand-mark"
     [class.brand-mark--xs]="size === 'xs'"
     [class.brand-mark--sm]="size === 'sm'"
     [class.brand-mark--md]="size === 'md'"
     [class.brand-mark--lg]="size === 'lg'"
     [class.brand-mark--icon-only]="variant === 'icon'">
  <div class="brand-mark__icon" aria-hidden="true">
    <svg class="brand-mark__svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3.75L5 7.75v8.5L12 20.25 19 16.25V7.75L12 3.75z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M5 7.75L12 12 19 7.75" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M12 12v8.25" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="1.75" fill="currentColor"/>
    </svg>
  </div>

  <div *ngIf="variant === 'full'" class="brand-mark__text">
    <span class="brand-mark__name" [ngClass]="nameClass">{{ brandName }}</span>
    <span *ngIf="showTagline" class="brand-mark__tagline" [ngClass]="taglineClass">{{ brandTagline }}</span>
  </div>
</div>
