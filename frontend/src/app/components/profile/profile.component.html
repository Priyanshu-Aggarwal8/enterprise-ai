<div class="page-shell page-shell--profile">
  <div class="page-container page-container--wide">
    <div class="profile-card card-shadow">
      <div class="profile-rail text-on-accent">
        <div class="profile-rail__avatar avatar-on-accent">{{ initials }}</div>
        <div class="profile-rail__name" [title]="displayName">{{ displayName }}</div>
        <div *ngIf="email" class="profile-rail__email" [title]="email">{{ email }}</div>
        <div class="profile-rail__role">Member</div>
      </div>

      <div class="profile-body">
        <h3 class="page-title text-xl mb-1">Profile</h3>
        <p class="page-subtitle mb-6">Manage your account and organization.</p>

        <div class="grid grid-cols-1 gap-4">
          <div class="info-tile">
            <div class="info-tile__label">Email</div>
            <div class="info-tile__value">{{ email || '—' }}</div>
          </div>

          <div class="info-tile">
            <div class="info-tile__label">Organization</div>
            <div class="info-tile__value">{{ orgName || 'Not assigned' }}</div>
            <div class="info-tile__meta">ID: {{ orgId || '—' }}</div>
            <div class="mt-3">
              <button (click)="copyOrgId()" [disabled]="!orgId" class="px-3 py-1 btn-accent rounded text-sm disabled:opacity-50">
                Copy Org ID
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
